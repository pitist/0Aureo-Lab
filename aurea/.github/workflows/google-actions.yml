name: Google Actions (Testing + Auth + OSV Scanner CLI)

on:
  push:
  workflow_dispatch:

jobs:
  google:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 1. Google Actions Testing
      - name: Google Actions Testing
        uses: google-github-actions/test-action@v2.0.1
        continue-on-error: true

      # 2. Autenticación en Google Cloud (opcional)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        continue-on-error: true
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. OSV Scanner (instalación y ejecución directa, sin la acción rota)
      - name: Instalar OSV Scanner
        run: npm install -g osv-scanner
        continue-on-error: true

      - name: Ejecutar OSV Scanner
        run: osv-scanner --config=osv-scanner.toml ./...
        continue-on-error: true
